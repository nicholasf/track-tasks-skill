background = "When a task fails, the record of that failure is stored on the task itself as a numbered section. There is no new task and no link field. The sections must not reach the executing model on a retry: the task file is input to that model, so failure logs accumulating in it would inflate the very context budget the retry needs. render is the model-facing view and is already selective — it emits only certain fields — so sections simply must not be added to it."
changes = ["Add a Section pydantic model in scripts/task.py with these fields, all defaulting to empty: kind, at_utc, at_local, agent, model, complexity, outcome, log", "kind names what the section records, for example 'failure'", "at_utc is an ISO 8601 UTC timestamp; at_local is the same instant rendered in a readable local form with its zone abbreviation. Both are strings on the model — generating them is the record-failure task's job, not this one", "complexity holds the pre-flight rating at the time of the attempt, for example 'L1 ~13,938'; outcome holds a one-line result; log holds longer detail and may be multi-line", "Add a sections field to Task, defaulting to empty, keyed by section number as a string so it serializes as [sections.1], [sections.2] and so on", "Do NOT add sections to render — this is the point of the task. Add a test asserting that a task with a populated section renders without that section's content appearing anywhere in the output", "Add a test that a Task with two sections round-trips through to_toml and from_toml unchanged"]
